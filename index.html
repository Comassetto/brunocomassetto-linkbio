<head>
<meta charset="UTF-8">

<meta name="description" content="Links do Bruno Comassetto — Instagram da Novva, TikTok, parcerias e contato.">
<title>Bruno Comassetto</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg-deep:#0a0e16;
  --bg-mid:#1a2029;
  --card:#181d26;
  --card-line:#2d333e;
  --text:#f2f1ec;
  --text-soft:#9a9fa8;
  --accent:#2f6fed;
}
*{ box-sizing:border-box; }
html,body{ margin:0; }
body{
  background:
    radial-gradient(720px 540px at 50% -8%, rgba(19,8,255,.32) 0%, rgba(19,8,255,0) 62%),
    radial-gradient(500px 400px at 85% 25%, rgba(0,253,255,.10) 0%, rgba(0,253,255,0) 60%),
    linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 100%);
  color:var(--text);
  font-family:'Manrope',Arial,sans-serif; font-weight:400;
  min-height:100vh; display:flex; justify-content:center;
  padding:48px 20px 40px;
}
img{ max-width:100%; }
.page{ width:100%; max-width:400px; text-align:center; }

.avatar-ring{
  width:120px; height:120px; border-radius:50%; margin:0 auto 18px; padding:4px;
  background:conic-gradient(from 180deg, #1308FF, #00FDFF, #1308FF);
  box-shadow:0 10px 26px rgba(0,0,0,.6);
  display:flex; align-items:center; justify-content:center;
}
.avatar{
  width:100%; height:100%; border-radius:50%; overflow:hidden;
  border:3px solid #000;
  display:flex; align-items:center; justify-content:center;
  background:#0c0c0c;
}
.avatar img{ width:100%; height:100%; object-fit:cover; display:block; }

.handle{ font-family:'Bebas Neue',Arial,sans-serif; font-size:29px; letter-spacing:.03em; color:var(--text); margin:0 0 12px; }

.tagline{ font-size:13.5px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; color:var(--text-soft); margin:0 auto 22px; }

.contact-label{ font-size:10px; letter-spacing:.16em; text-transform:uppercase; font-weight:600; color:var(--text-soft); margin-bottom:5px; }
.email{ font-size:14.5px; font-weight:700; color:var(--text); letter-spacing:.01em; margin-bottom:24px; }

.bars{ display:flex; flex-direction:column; gap:11px; margin-bottom:28px; }
@property --border-angle{
  syntax:'<angle>'; inherits:false; initial-value:0deg;
}
@keyframes borderSpin{ to{ --border-angle:360deg; } }
.bar{
  display:flex; align-items:center; justify-content:center; gap:9px;
  padding:15px 16px; border-radius:5px;
  text-decoration:none; font-family:'Bebas Neue',Arial,sans-serif; font-size:16px; letter-spacing:.05em;
  border:1px solid transparent; background-origin:border-box; background-clip:padding-box, border-box;
  transition:transform .15s ease, filter .2s ease;
  animation:borderSpin 5s linear infinite;
}
.bar:hover{ transform:translateY(-1px); filter:brightness(1.08); }
.bar svg{ width:18px; height:18px; flex-shrink:0; }
.bar img, .bar .novva-icon{ width:26px; height:26px; flex-shrink:0; display:block; }
.bar.primary{
  background-image:linear-gradient(var(--text), var(--text)), conic-gradient(from var(--border-angle), #1308FF, #00FDFF, #1308FF);
  color:#0c0c0c;
}
.bar.secondary{
  background-image:linear-gradient(var(--card), var(--card)), conic-gradient(from var(--border-angle), #1308FF, #00FDFF, #1308FF);
  color:var(--text);
}
@media (prefers-reduced-motion: reduce){
  .bar{ animation:none; }
}

.divider{
  display:flex; align-items:center; gap:12px; margin:4px 0 16px;
  font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--text-soft); font-weight:600;
}
.divider::before, .divider::after{ content:""; flex:1; height:1px; background:var(--card-line); }

.partners{ display:flex; flex-direction:column; gap:9px; }
.partner{
  display:flex; align-items:center; gap:14px;
  padding:14px 20px; border-radius:8px; background:var(--card); border:1px solid var(--card-line);
  text-decoration:none; color:var(--text);
}
.partner:hover{ border-color:#4a4a4a; }
.partner-icon{ width:28px; height:28px; border-radius:6px; overflow:hidden; flex-shrink:0; background:#000; display:flex; align-items:center; justify-content:center; }
.partner-icon img{ width:100%; height:100%; object-fit:cover; display:block; }
.partner-name{ flex:1; min-width:0; font-size:13px; font-weight:600; text-align:left; }
.partner-coupon{ font-size:12.5px; font-weight:700; letter-spacing:.03em; color:var(--text); white-space:nowrap; }
.partner-coupon b{ color:#4d6bff; font-weight:800; font-size:14px; }
</style>
</head>
